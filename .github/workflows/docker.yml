# Imagen de producción: buenas prácticas del Dockerfile + CVEs en capas base/deps dentro de la imagen.
name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - requirements.txt
      - requirements-dev.txt
      - app/**
  pull_request:
    branches: [main, master]
    paths:
      - Dockerfile
      - requirements.txt
      - requirements-dev.txt
      - app/**

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-y-trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: hadolint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build imagen
        run: docker build -t portfolio-api:ci .

      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-api:ci
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
