# Imagen de producción: buenas prácticas del Dockerfile + CVEs en capas base/deps dentro de la imagen.
name: Docker

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - requirements.txt
      - requirements-dev.txt
      - app/**
  pull_request:
    branches: [main, master]
    paths:
      - Dockerfile
      - requirements.txt
      - requirements-dev.txt
      - app/**

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-y-trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: hadolint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build imagen
        run: docker build -t portfolio-api:ci .

      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: portfolio-api:ci
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
