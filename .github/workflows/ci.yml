# Calidad mínima: smoke sintáctico, bandit, pip-audit y pytest.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-y-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python (alineado con Dockerfile base)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias de aplicación
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pip check (árbol de dependencias roto)
        run: pip check

      - name: pip-audit (CVEs en dependencias del proyecto)
        run: |
          pip install "pip-audit>=2.7"
          pip-audit -r requirements-dev.txt --desc on

      - name: Compilación sintáctica app/
        run: python -m compileall -q app

      - name: bandit (SAST app/)
        run: bandit -r app -ll -q

      - name: pytest (chat MVP)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/portfolio_test
        run: pytest -q
